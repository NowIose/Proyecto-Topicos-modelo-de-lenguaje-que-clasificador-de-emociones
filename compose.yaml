# docker compose up --build        -> app completa en http://localhost:8000
# docker compose run --rm entrenar -> reentrena y deja el modelo en ./artifacts
services:
  app:
    build: .
    image: critiqai:1.0
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  entrenar:
    image: critiqai:1.0
    build: .
    profiles: ["entrenar"]
    command: ["python", "-m", "src.models.entrenar"]
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts
